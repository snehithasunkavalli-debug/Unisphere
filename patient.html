<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Patient Registration Form</h1>
        <p class="subtitle">Please enter your details for registration</p>
        <form>
            <input type="hidden" name="patient_id" value="PAT2026">
            <div class="form-grid">
                <div class="form-group">
                    <label for="name">Patient Name</label>
                    <input type="text" id="name" name="name" placeholder="Enter patient name" required>
                </div>
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Enter email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                </div>
                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="Enter contact number" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" min="1" max="120" placeholder="Enter age" required>
                </div>
                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
                <div class="form-group">
                    <label for="time">Appointment Time</label>
                    <input type="time" id="time" name="time" required>
                </div>
                <div class="form-group">
                    <label for="appointment">Appointment Date & Time</label>
                    <input type="datetime-local" id="appointment" name="appointment" required>
                </div>
                <div class="form-group">
                    <label for="website">Personal Website / Reference</label>
                    <input type="url" id="website" name="website" placeholder="https://example.com">
                </div>
                <div class="form-group">
                    <label for="doctor">Search Doctor</label>
                    <input type="search" id="doctor" name="doctor" list="doctors" placeholder="Search doctor">
                    <datalist id="doctors">
                        <option value="Dr. Ananya">
                        <option value="Dr. Rahul">
                        <option value="Dr. Priya">
                        <option value="Dr. Kiran">
                    </datalist>
                </div>
                <div class="form-group">
                    <label for="color">Favorite Consultation Color</label>
                    <input type="color" id="color" name="color" value="#4f46e5">
                </div>
                <div class="form-group">
                    <label for="record">Medical Record Upload</label>
                    <input type="file" id="record" name="record" accept=".pdf,.jpg,.jpeg,.png">
                </div>
                <div class="form-group">
                    <label for="pain">Pain Level: <span id="painValue">5</span></label>
                    <input type="range" id="pain" name="pain" min="0" max="10" value="5">
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </div>
                <div class="form-group full-width">
                    <label>Known Allergies</label>
                    <div class="checkbox-group">
                        <label><input type="checkbox" name="allergy" value="dust"> Dust</label>
                        <label><input type="checkbox" name="allergy" value="food"> Food</label>
                        <label><input type="checkbox" name="allergy" value="medicine"> Medicine</label>
                        <label><input type="checkbox" name="allergy" value="pollen"> Pollen</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="blood">Blood Group</label>
                    <select id="blood" name="blood" required>
                        <option value="">Select Blood Group</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
                <div class="form-group full-width">
                    <label for="address">Address</label>
                    <textarea id="address" name="address" rows="4" placeholder="Enter complete address"></textarea>
                </div>
            </div>
            <div class="buttons">
                <input type="submit" value="Register Patient">
                <input type="reset" value="Reset Form">
                <input type="image" src="https://img.icons8.com/fluency/48/online-payment.png" alt="Online Payment" class="payment">
            </div>
        </form>
    </div>
    <script>
        const pain = document.getElementById("pain");
        const painValue = document.getElementById("painValue");
        pain.addEventListener("input", function() {
            painValue.textContent = pain.value;
        });
    </script>

</body>
</html>
