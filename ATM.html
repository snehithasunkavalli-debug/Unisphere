<!DOCTYPE html>
<html>
<head>
    <title>ATM PIN Entry</title>
</head>
<body>
    <h2>ATM PIN Entry</h2>

    <input type="text" id="pin" placeholder="Enter PIN">
    <p id="message"></p>

    <script>
        const pin = document.getElementById("pin");
        const message = document.getElementById("message");

        pin.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                message.textContent = "PIN Submitted Successfully";
            } else if (/^[0-9]$/.test(event.key)) {
                message.textContent = "PIN Entry Started";
            } else if (event.key.length === 1) {
                message.textContent = "Warning: Please enter numbers only";
            }
        });
    </script>
