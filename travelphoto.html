<!DOCTYPE html>
<html>
<head>
    <title>Travel Photo Gallery</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }
        img {
            width: 500px;
            height: 300px;
            object-fit: cover;
        }
        #destination {
            font-size: 20px;
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h2>Travel Photo Gallery</h2>
    <img id="travelImage" src="paris.jpg" alt="Travel Destination">
    <p id="destination"></p>
    <script>
        const destinations = [
            { image: "paris.jpg", name: "Paris" },
            { image: "london.jpg", name: "London" },
            { image: "tokyo.jpg", name: "Tokyo" }
        ];
        let index = 0;
        const travelImage = document.getElementById("travelImage");
        const destination = document.getElementById("destination");
        document.addEventListener("keydown", function(event) {
            if (event.key.toLowerCase() === "n") {
                index = (index + 1) % destinations.length;
                travelImage.src = destinations[index].image;
                destination.textContent = "";
            } else if (event.key.toLowerCase() === "p") {
                index = (index - 1 + destinations.length) % destinations.length;
                travelImage.src = destinations[index].image;
                destination.textContent = "";
            } else if (event.code === "Space") {
                destination.textContent = destinations[index].name;
            }
        });
    </script>

</body>
</html>
