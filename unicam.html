<!DOCTYPE html>
<html>
<head>
    <title>Campus Image</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 40px;
        }
        img {
            width: 500px;
            height: 300px;
            object-fit: cover;
        }
        #message {
            font-weight: bold;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h2>Campus Image Gallery</h2>
    <img id="campusImage" src="campus1.jpg" alt="Campus">
    <p id="message"></p>
    <script>
        const images = ["campus1.jpg", "campus2.jpg", "campus3.jpg"];
        let index = 0;
        const campusImage = document.getElementById("campusImage");
        const message = document.getElementById("message");
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowRight") {
                index = (index + 1) % images.length;
                campusImage.src = images[index];
                message.textContent = "";
            } else if (event.key === "ArrowLeft") {
                index = (index - 1 + images.length) % images.length;
                campusImage.src = images[index];
                message.textContent = "";
            } else if (event.key === "Enter") {
                message.textContent = "Image Selected";
            }
        });
    </script>

</html>
