<!DOCTYPE html>
<html>
<head>
    <title>Interactive Product Card</title>
</head>
<body>

<div style="width:300px; padding:20px; border:1px solid black;">
    <img id="product" src="watch.jpg"
         width="250"
         onmouseover="changeImage()"
         onmouseout="restoreImage()">

    <h2>Smart Watch</h2>

    <p id="info"></p>

    <button onclick="viewDetails()">View Details</button>
</div>

<script>
function changeImage() {
    document.getElementById("product").style.opacity = "0.5";
    document.getElementById("info").innerHTML = "Fitness tracking, heart rate monitor and Bluetooth";
}

function restoreImage() {
    document.getElementById("product").style.opacity = "1";
    document.getElementById("info").innerHTML = "";
}

function viewDetails() {
    document.getElementById("info").innerHTML = "Price: ₹2,999 | Availability: In Stock";
}
</script>

</body>
</html>
