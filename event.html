<!DOCTYPE html>
<html>
<head>
    <title>Mouse Event Handling</title>
</head>
<body>

    <p id="text">Original Text</p>

    <button onmouseover="changeText()" onmouseout="restoreText()">
        Hover Me
    </button>

    <script>
        function changeText() {
            document.getElementById("text").innerHTML = "Welcome to VIT!";
        }

        function restoreText() {
            document.getElementById("text").innerHTML = "Original Text";
        }
    </script>
