<!DOCTYPE html>
<html>
<head>
    <title>Weather Status</title>
    <style>
        .weather {
            display: flex;
            gap: 20px;
        }

        .panel {
            width: 150px;
            padding: 30px;
            text-align: center;
            border: 2px solid black;
            font-size: 20px;
        }

        #sunny {
            background-color: lightyellow;
        }

        #cloudy {
            background-color: lightgray;
        }

        #rainy {
            background-color: lightblue;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="weather">
        <div class="panel" id="sunny"
             onmouseover="showMessage('Perfect Day!')"
             onmouseout="restore()"><br>Sunny</div>

        <div class="panel" id="cloudy"
             onmouseover="showMessage('Cloudy Weather')"
             onmouseout="restore()"><br>Cloudy</div>

        <div class="panel" id="rainy"
             onmouseover="showMessage('Carry an Umbrella!')"
             onmouseout="restore()"><br>Rainy</div>
    </div>

    <p id="message"></p>

    <script>
        function showMessage(text) {
            document.getElementById("message").innerHTML = text;
        }

        function restore() {
            document.getElementById("message").innerHTML = "";
        }
    </script>

</html>
