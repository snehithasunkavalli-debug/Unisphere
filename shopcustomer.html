<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Details</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Customer & Delivery Details</h1>
        <form action="payment.html">
            <label for="name">Customer Name</label>
            <input type="text" id="name" name="name" placeholder="Enter your name" required>
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <label for="mobile">Mobile Number</label>
            <input type="tel" id="mobile" name="mobile" placeholder="Enter mobile number" pattern="[0-9]{10}" required>
            <label for="address">Delivery Address</label>
            <textarea id="address" name="address" rows="4" placeholder="Enter delivery address" required></textarea>
            <label for="city">City</label>
            <input type="text" id="city" name="city" placeholder="Enter city" required>
            <label for="state">State</label>
            <select id="state" name="state" required>
                <option value="">Select State</option>
                <option>Andhra Pradesh</option>
                <option>Telangana</option>
                <option>Tamil Nadu</option>
                <option>Karnataka</option>
                <option>Kerala</option>
                <option>Maharashtra</option>
                <option>Delhi</option>
            </select>
            <label for="pin">PIN Code</label>
            <input type="number" id="pin" name="pin" placeholder="Enter PIN code" required>
            <label for="date">Delivery Date</label>
            <input type="date" id="date" name="date" required>
            <div class="buttons">
                <input type="submit" value="Continue to Payment">
                <a href="index.html" class="cancel">Back</a>
            </div>
        </form>
    </div>

<!-- UniSphere Global Navigation Hub Badge -->

    <span style="font-size:16px;">&#127969;</span> UniSphere Portal
</a>

</body>
</html>
