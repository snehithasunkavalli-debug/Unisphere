<!DOCTYPE html>
<html>
<head>
    <title>Mouse Event Handling</title>
</head>
<body>

    <div id="box"
         style="width:200px; height:100px; background-color:lightblue;"
         onclick="changeColor()"
         onmouseover="showMessage()">
    </div>

    <p id="message"></p>

    <script>
        function changeColor() {
            document.getElementById("box").style.backgroundColor = "yellow";
        }

        function showMessage() {
            document.getElementById("message").innerHTML = "Mouse is over the box";
        }
    </script>
