<!DOCTYPE html>
<html>
<head>
    <title>Dynamic Search Engine</title>
</head>
<body style="margin:0;font-family:Arial,sans-serif;">
<div style="width:100%;height:90px;background:#0b6fa4;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 20px;box-sizing:border-box;">
    <div style="font-size:28px;font-weight:bold;">
        Smart Search Engine
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
        <input type="text" placeholder="Search products, services, or articles..." style="padding:8px;border-radius:5px;border:none;width:250px;">
        <select style="padding:8px;border-radius:5px;border:none;">
            <option>All Categories</option>
            <option>Electronics</option>
            <option>Books</option>
            <option>Clothing</option>
            <option>Groceries</option>
        </select>
        <select style="padding:8px;border-radius:5px;border:none;">
            <option>Any Price</option>
            <option>Under ₹500</option>
            <option>₹500 - ₹2,000</option>
            <option>Above ₹2,000</option>
        </select>
        <button style="padding:8px 15px;background:orange;color:white;border:none;border-radius:5px;cursor:pointer;" onmouseover="this.style.background='darkorange'" onmouseout="this.style.background='orange'">
            Search
        </button>
    </div>
</div>

<!-- UniSphere Global Navigation Hub Badge -->
<a href="Final_Website.html" id="unisphereFloatingBadge" style="position:fixed; bottom:22px; right:22px; background:linear-gradient(135deg, #1e3a8a, #2563eb); color:#ffffff; padding:11px 20px; border-radius:30px; font-weight:700; font-size:13px; text-decoration:none; box-shadow:0 8px 24px rgba(30,58,138,0.35); z-index:999999; font-family:'Segoe UI', Arial, sans-serif; display:flex; align-items:center; gap:8px; border:1px solid rgba(255,255,255,0.2); transition:all 0.2s ease;">
    <span style="font-size:16px;">&#127969;</span> UniSphere Portal
</a>

</body>
</html>
