<!DOCTYPE html>
<html>
<head>
    <title>Traffic Signal</title>
    <style>
        .signal {
            width: 100px;
            padding: 15px;
            background-color: black;
            border-radius: 10px;
        }

        .light {
            width: 60px;
            height: 60px;
            margin: 10px auto;
            border-radius: 50%;
        }

        #red {
            background-color: red;
        }

        #yellow {
            background-color: yellow;
        }

        #green {
            background-color: green;
        }

        #message {
            font-size: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="signal">
        <div class="light" id="red"
             onmouseover="showMessage('STOP')"
             onmouseout="restore()"></div>

        <div class="light" id="yellow"
             onmouseover="showMessage('READY')"
             onmouseout="restore()"></div>

        <div class="light" id="green"
             onmouseover="showMessage('GO')"
             onmouseout="restore()"></div>
    </div>

    <p id="message"></p>

    <script>
        function showMessage(text) {
            document.getElementById("message").innerHTML = text;
        }

        function restore() {
            document.getElementById("message").innerHTML = "";
        }
    </script>
