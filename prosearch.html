<!DOCTYPE html>
<html>
<head>
    <title>Product Search</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 50px;
        }
        #searchBox {
            padding: 10px;
            width: 300px;
            border: 2px solid #333;
            border-radius: 5px;
        }
        #result {
            margin-top: 20px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <h2>Product Search</h2>
    <input type="text" id="searchBox" placeholder="Enter product name">
    <p id="result"></p>
    <script>
        const searchBox = document.getElementById("searchBox");
        const result = document.getElementById("result");
        searchBox.addEventListener("input", function() {
            result.textContent = searchBox.value;
            searchBox.style.backgroundColor = "lightyellow";
        });
        searchBox.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                result.textContent = "Searching for: " + searchBox.value;
            }
        });
    </script>
